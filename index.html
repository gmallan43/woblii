<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Woblii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#181512;--surface:#221e18;--surface2:#2c271f;
  --border:rgba(201,168,76,0.15);--accent:#c9a84c;--accent-dim:rgba(201,168,76,0.28);
  --teal:#4a9b8e;--teal-dim:rgba(74,155,142,0.22);
  --text:#f0ebe0;--text-muted:#8a8070;--text-soft:#b8b0a0;
  --voltage:#c47a5a;--voltage-dim:rgba(196,122,90,0.18);
  --danger:#c47a5a;--success:#6aab7c;
  --radius:14px;--radius-sm:8px;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-b:'Libre Franklin',system-ui,sans-serif;
}
[data-state=flat]{--accent:#7a8fa8;--accent-dim:rgba(122,143,168,0.22);--teal:#5a7888;--bg:#12141a;--surface:#191c24;--surface2:#1f2230;--border:rgba(100,120,160,0.15)}
[data-state=fragile]{--accent:#a89060;--accent-dim:rgba(168,144,96,0.2);--bg:#161210;--surface:#1e1814;--surface2:#261e18;--border:rgba(168,144,96,0.15)}
[data-state=steady]{--accent:#7ab87a;--accent-dim:rgba(122,184,122,0.22);--teal:#5aa870;--border:rgba(122,184,122,0.2);--bg:#141a14;--surface:#1a201a;--surface2:#202820}
[data-state=energised]{--accent:#d4b454;--accent-dim:rgba(212,180,84,0.3);--teal:#54b0a0;--border:rgba(212,180,84,0.2)}
[data-state=lit-up]{--accent:#e0c040;--accent-dim:rgba(224,192,64,0.3);--teal:#44c0a8;--border:rgba(224,192,64,0.22);--voltage:#e07050}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.42;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E")}
#app{min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen-inner{max-width:540px;width:100%;margin:0 auto;padding:40px 24px 60px;flex:1;display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s ease both}

/* TYPOGRAPHY */
.display{font-family:var(--font-d);font-weight:300;font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.15;letter-spacing:-.01em}
.display em,.heading em{font-style:italic;color:var(--accent)}
.heading{font-family:var(--font-d);font-weight:400;font-size:clamp(1.25rem,3.5vw,1.65rem);line-height:1.2;color:var(--text)}
.label{font-family:var(--font-b);font-weight:500;font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted)}
.body-text{font-size:.93rem;color:var(--text-soft);line-height:1.72}
.muted{color:var(--text-muted)}
.logo{font-family:var(--font-d);font-weight:300;font-size:1.05rem;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:44px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;transition:background .4s,border .4s}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;margin-bottom:12px;transition:background .4s,border .4s}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:50px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:500;font-size:.84rem;letter-spacing:.05em;transition:all .25s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--accent);color:var(--bg)}.btn-primary:hover{opacity:.87;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text-soft);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-teal{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(74,155,142,.28)}
.btn-voltage{background:var(--voltage-dim);color:var(--voltage);border:1px solid rgba(196,122,90,.28)}
.btn-full{width:100%}.btn-sm{padding:7px 15px;font-size:.79rem}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:1rem;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.btn-icon:hover{border-color:var(--accent-dim);color:var(--accent)}
.btn-danger{background:transparent;color:var(--text-muted);border:1px solid rgba(196,122,90,.2);font-size:.75rem;padding:6px 14px}.btn-danger:hover{border-color:var(--danger);color:var(--danger)}

/* STATE GRID */
.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:22px 0}
@media(max-width:400px){.state-grid{grid-template-columns:repeat(3,1fr)}}
.state-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.state-btn:hover{border-color:var(--accent-dim)}.state-btn.selected{background:var(--accent-dim);border-color:var(--accent)}
.state-btn .emoji{font-size:1.4rem}
.state-btn .slabel{font-size:.62rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.state-btn.selected .slabel{color:var(--accent)}

/* BODY CHECK */
.body-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.body-row:last-child{border-bottom:none}
.body-row .q{flex:1;font-size:.88rem}
.bopts{display:flex;gap:5px}
.bopt{padding:5px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:.73rem;cursor:pointer;transition:all .2s;white-space:nowrap;color:var(--text-soft);font-family:var(--font-b);-webkit-tap-highlight-color:transparent}
.bopt.on{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}

/* JAR */
.jar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.jar-drops{display:flex;flex-wrap:wrap;gap:4px}
.drop{width:10px;height:13px;background:var(--teal-dim);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1px solid rgba(74,155,142,.22);transition:all .3s}
.drop.used{background:var(--teal);border-color:var(--teal)}.drop.over{background:var(--voltage);border-color:var(--voltage)}

/* ORT */
.ort-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--accent-dim);border-radius:var(--radius);padding:22px;margin-bottom:18px;position:relative;overflow:hidden;transition:all .4s}
.ort-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);border-radius:3px 0 0 3px;transition:background .4s}
.ort-card.done{border-color:var(--success);opacity:.72}.ort-card.done::before{background:var(--success)}
.ort-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--font-d);font-size:1.25rem;font-weight:300;padding:7px 0;outline:none;margin-top:9px;transition:border-color .2s}
.ort-input:focus{border-bottom-color:var(--accent)}.ort-input::placeholder{color:var(--text-muted);font-style:italic}

/* TASKS */
.task-item{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:all .28s;position:relative}
.task-item.done{opacity:.42;text-decoration:line-through;text-decoration-color:var(--success)}.task-item.done .tchk{background:var(--success);border-color:var(--success)}
.tchk{width:21px;height:21px;min-width:21px;border-radius:6px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:.72rem;transition:all .22s;-webkit-tap-highlight-color:transparent;margin-top:1px}
.tchk:hover{border-color:var(--accent)}
.tcontent{flex:1;min-width:0}
.ttext{font-size:.9rem;color:var(--text);line-height:1.4;word-break:break-word}
.tmeta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.sbadge{font-size:.63rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.sbadge.tiny{background:rgba(106,171,124,.14);color:var(--success)}.sbadge.small{background:var(--teal-dim);color:var(--teal)}.sbadge.medium{background:var(--accent-dim);color:var(--accent)}.sbadge.heavy{background:var(--voltage-dim);color:var(--voltage)}
.tbc{margin-top:5px;padding:4px 9px;background:rgba(74,155,142,.07);border-radius:5px;border-left:2px solid var(--teal);display:flex;align-items:center;gap:5px}
.tbc span{font-size:.73rem;color:var(--teal);font-style:italic}
.tdel{opacity:0;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.92rem;padding:2px 3px;transition:all .2s;line-height:1;flex-shrink:0}
.task-item:hover .tdel{opacity:1}.task-item:hover .tdel:hover{color:var(--danger)}

/* ENOUGH LINE */
.enough-line{display:flex;align-items:center;gap:11px;margin:14px 0}
.enough-line .el{flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.enough-line .er{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.enough-line .etxt{font-family:var(--font-d);font-style:italic;font-size:.83rem;color:var(--accent);white-space:nowrap;font-weight:400}

/* ADD TASK */
.add-form{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;margin-bottom:11px;display:none}.add-form.open{display:block}
.ati{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--font-b);font-size:.88rem;padding:5px 0 7px;outline:none;margin-bottom:13px}
.ati::placeholder{color:var(--text-muted)}.ati:focus{border-bottom-color:var(--accent)}
.size-sel{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.sopt{padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:.73rem;cursor:pointer;color:var(--text-soft);transition:all .2s;font-family:var(--font-b);-webkit-tap-highlight-color:transparent}
.sopt.on{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.bci{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-muted);font-family:var(--font-b);font-size:.8rem;font-style:italic;padding:4px 0 5px;outline:none;margin-bottom:11px}
.bci::placeholder{color:var(--text-muted);opacity:.55}

/* VOLTAGE */
.vbox{background:var(--surface);border:1px solid rgba(196,122,90,.28);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.vrule{font-size:.77rem;color:var(--text-muted);font-style:italic;margin-bottom:11px;padding:8px 11px;background:var(--voltage-dim);border-radius:var(--radius-sm);line-height:1.5}
.vitem{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.83rem}.vitem:last-child{border-bottom:none}
.vage{font-size:.68rem;color:var(--text-muted);flex-shrink:0;margin-top:1px}.vtxt{flex:1;color:var(--text-soft)}

/* EVIDENCE */
.ev-item{padding:11px 15px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:8px;font-size:.86rem;color:var(--text-soft);border-left:2px solid var(--accent);line-height:1.5}

/* NIGHT */
.night-screen{background:#0c0a08;min-height:100vh;display:flex;flex-direction:column}
.night-inner{max-width:420px;margin:0 auto;padding:55px 22px;text-align:center}
.dump-ta{width:100%;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);color:var(--text-soft);font-family:var(--font-b);font-size:.88rem;padding:15px;outline:none;resize:none;line-height:1.7;min-height:95px;margin:14px 0}
.dump-ta:focus{border-color:rgba(201,168,76,.28)}.dump-ta::placeholder{color:rgba(255,255,255,.17)}
.close-ta{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-b);font-size:.88rem;padding:13px;outline:none;resize:none;line-height:1.7;min-height:78px;margin:9px 0 18px;transition:border-color .2s}
.close-ta:focus{border-color:var(--accent-dim)}.close-ta::placeholder{color:var(--text-muted);font-style:italic}
.text-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-b);font-size:.88rem;padding:11px 13px;outline:none;transition:border-color .2s;margin:9px 0}
.text-input:focus{border-color:var(--accent-dim)}.text-input::placeholder{color:var(--text-muted);font-style:italic}

/* NAV */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0;max-width:540px;margin:0 auto;width:100%}
.nav-acts{display:flex;gap:7px}
.bot-acts{display:flex;gap:9px;padding:18px 22px;border-top:1px solid var(--border);max-width:540px;margin:0 auto;width:100%}

/* UTILS */
.divider{height:1px;background:var(--border);margin:18px 0}
.spacer{flex:1}.gap-sm{height:7px}.gap{height:14px}.gap-lg{height:28px}
.pdots{display:flex;gap:5px;margin-bottom:28px}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border);border:1px solid var(--border);transition:all .28s}
.pdot.act{background:var(--accent);border-color:var(--accent)}.pdot.dn{background:var(--teal);border-color:var(--teal)}
.sbadge-state{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;background:var(--accent-dim);border:1px solid var(--accent);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{width:3px}.scroll-area::-webkit-scrollbar-track{background:transparent}.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:9px 18px;font-size:.8rem;color:var(--text-soft);opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;z-index:1000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ret-quote{font-family:var(--font-d);font-size:clamp(1.35rem,3.8vw,1.7rem);font-weight:300;font-style:italic;line-height:1.4;color:var(--text-soft);text-align:center;margin:28px 0}
.ret-quote strong{font-style:normal;font-weight:400;color:var(--text)}
.sec-label{font-size:.63rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.star-sep{text-align:center;color:var(--accent);opacity:.35;font-size:.58rem;letter-spacing:10px;margin:18px 0}
.cban{background:linear-gradient(135deg,var(--voltage-dim),rgba(196,122,90,.05));border:1px solid rgba(196,122,90,.32);border-radius:var(--radius-sm);padding:11px 15px;font-size:.8rem;color:var(--voltage);margin-bottom:14px;line-height:1.5}

/* REG SCREEN */
.reg-screen{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
@keyframes breatheCircle{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.3);opacity:1}}
.breathe-circle{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--teal-dim),transparent);border:1.5px solid var(--teal);margin:28px auto;animation:breatheCircle 5s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--teal);font-weight:500;letter-spacing:.08em}

/* MIDDAY */
.midday-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .28s ease both}
.midday-sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:26px 22px 44px;max-width:540px;width:100%;animation:slideUp .32s cubic-bezier(.34,1.2,.64,1) both}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mds-btn{padding:7px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:.8rem;cursor:pointer;color:var(--text-soft);transition:all .2s;font-family:var(--font-b);-webkit-tap-highlight-color:transparent;display:inline-block;margin:4px}
.mds-btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* AUTH SCREENS */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;background:var(--bg)}
.auth-inner{max-width:380px;width:100%;margin:0 auto}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:.75rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.email-status{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:20px 0}
.email-address{font-family:var(--font-d);font-size:1.1rem;color:var(--accent);margin:8px 0}
.sync-indicator{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;color:var(--text-muted);padding:3px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-dot.syncing{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}

/* COMPANION SHARED */
@keyframes bubblePop{0%{transform:scale(.65) translateY(9px);opacity:0}62%{transform:scale(1.05) translateY(-2px);opacity:1}100%{transform:scale(1);opacity:1}}
.companion-card{display:flex;align-items:flex-end;gap:13px;border-radius:var(--radius);padding:15px 17px;margin-bottom:18px;position:relative;overflow:visible}
.companion-figure{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.companion-name{font-size:.58rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.companion-bubble{flex:1;border-radius:14px 14px 14px 4px;padding:11px 13px;animation:bubblePop .42s cubic-bezier(.34,1.56,.64,1) .26s both;min-height:50px;display:flex;align-items:center;position:relative}
.companion-bubble::before{content:'';position:absolute;bottom:-1px;left:-7px;width:11px;height:9px;border-radius:0 0 0 7px;clip-path:polygon(100% 0,0 100%,100% 100%)}
.companion-bubble p{font-size:.84rem;line-height:1.52;font-weight:400}
.companion-bubble p strong{font-weight:600}

/* Crunchy */
.crunchy-card{background:linear-gradient(135deg,rgba(245,197,24,.09),rgba(245,197,24,.04));border:1px solid rgba(245,197,24,.26)}
.crunchy-card .companion-name{color:rgba(245,197,24,.42)}
.crunchy-card .companion-bubble{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.28)}
.crunchy-card .companion-bubble::before{background:rgba(245,197,24,.1);border-left:1px solid rgba(245,197,24,.28);border-bottom:1px solid rgba(245,197,24,.28)}
.crunchy-card .companion-bubble p{color:#f0d050}

/* Grumble */
.grumble-card{background:linear-gradient(135deg,rgba(130,120,180,.08),rgba(100,95,150,.04));border:1px solid rgba(140,130,190,.2)}
.grumble-card .companion-name{color:rgba(160,150,200,.4)}
.grumble-card .companion-bubble{background:rgba(130,120,170,.1);border:1px solid rgba(140,130,190,.22)}
.grumble-card .companion-bubble::before{background:rgba(130,120,170,.1);border-left:1px solid rgba(140,130,190,.22);border-bottom:1px solid rgba(140,130,190,.22)}
.grumble-card .companion-bubble p{color:#b8b0d8}

/* Colin */

async function sendMagicLink(){
  const emailEl=document.getElementById('email-input');
  const email=emailEl?.value?.trim();
  if(!email||!email.includes('@')){toast('Please enter a valid email address');return}
  pendingEmail=email;
  emailEl.disabled=true;
  document.getElementById('send-btn').textContent='Sending...';
  const{error}=await sb.auth.signInWithOtp({
    email,
    options:{emailRedirectTo:window.location.href}
  });
  if(error){
    toast('Something went wrong. Please try again.');
    emailEl.disabled=false;
    document.getElementById('send-btn').textContent='Send me a link →';
    return;
  }
  go('email-sent');
}
async function signOut(){
  await sb.auth.signOut();
  currentUser=null;todayData=null;evidenceItems=[];
  go('signin');
}

// ================================================================
// DATA INIT
// ================================================================
async function loadUserData(){
  // Load today
  const row=await dbLoadToday();
  todayData=row?dbToLocal(row):freshToday();
  // Load evidence
  evidenceItems=await dbLoadEvidence();
  // Decide where to go
  if(todayData.state){
    document.body.dataset.state=todayData.state;
    go('day');return;
  }
  const lastDate=await dbGetLastEntryDate();
  if(lastDate){
    const days=Math.floor((new Date(TODAY)-new Date(lastDate))/(1000*60*60*24));
    if(days>=3){go('return');return}
  }
  go('welcome');
}

// ================================================================
// ROUTER
// ================================================================
function go(s){
  const app=document.getElementById('app');
  const map={
    loading:rLoading,signin:rSignin,'email-sent':rEmailSent,
    welcome:rWelcome,return:rReturn,
    'state-check':rStateCheck,'body-check':rBodyCheck,
    regulation:rRegulation,day:rDay,
    evidence:rEvidence,'close-day':rCloseDay,
    night:rNight,done:rDone
  };
  if(!map[s])return;
  app.innerHTML=map[s]();
  document.body.dataset.state=todayData?.state||'steady';
  requestAnimationFrame(()=>{
    const el=app.querySelector('.screen,.night-screen,.reg-screen,.auth-screen');
    if(el){el.style.display='flex';el.classList.add('fade-in')}
  });
  bind();
}
function toast(m,d=2400){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),d);
}
function bind(){
  document.querySelectorAll('input[type=text],input[type=email]').forEach(i=>{
    i.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      if(i.id==='email-input')sendMagicLink();
      if(i.id==='ri')completeReturn();
      if(i.id==='ti')addTask();
      if(i.id==='ei')addEvidence();
      if(i.id==='vi')addVoltage();
    });
  });
}

    </div>
    ${todayData.ortDone
      ?`<div class="card-sm" style="border-color:var(--success);margin-bottom:16px;text-align:center"><p style="color:var(--success);font-size:.88rem">✓ Your one real thing is done. Today counts.</p></div>`
      :`<div class="card-sm" style="margin-bottom:16px;text-align:center;opacity:.65"><p class="body-text" style="font-size:.83rem">${done} of ${tot} tasks done.${tot===0?' You showed up. That is something.':''}</p></div>`}
    ${farewell}
    <div class="star-sep">✦ ✦ ✦</div>
    <div class="card" style="margin-bottom:14px">
      <p class="label" style="margin-bottom:5px">One thing that happened today</p>
      <p class="muted" style="font-size:.76rem;margin-bottom:4px">However small. Even just a moment.</p>
      <textarea class="close-ta" id="cl-h" placeholder="Something happened today, however small...">${todayData.close?.happening||''}</textarea>
    </div>
    <div class="card" style="margin-bottom:22px">
      <p class="label" style="margin-bottom:5px">What does tomorrow's version of you need to know?</p>
      <p class="muted" style="font-size:.76rem;margin-bottom:4px">A kindness. A warning. A reminder.</p>
      <textarea class="close-ta" id="cl-t" placeholder="Tomorrow you should know...">${todayData.close?.tomorrow||''}</textarea>
    </div>
    <button class="btn btn-primary btn-full" onclick="saveClose()">Save and rest →</button>
    <div class="gap-sm"></div>
    <button class="btn btn-ghost btn-full" onclick="go('day')">Back to today</button>
  </div></div>`
}

function rNight(){
  const ev=evidenceItems.length?evidenceItems[Math.floor(Math.random()*evidenceItems.length)].text:null;
  const isLow=['flat','fragile'].includes(todayData?.state);
  const nightComp=isLow?compMini('grumble',"Still here. <strong>That's something.</strong> The night will pass."):'';
  return`<div class="night-screen"><div class="night-inner">
    <div style="font-size:1.1rem;opacity:.28;letter-spacing:14px;margin-bottom:44px">· · ·</div>
    <div class="display" style="font-size:1.7rem;margin-bottom:14px;font-style:italic;color:var(--text-soft)">The night doesn't need solving.</div>
    <p class="body-text" style="margin-bottom:32px;font-size:.87rem">A place to put the thoughts down so they stop circling. Nothing here is a plan.</p>
    <div class="card" style="text-align:left;margin-bottom:14px;background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.065)">
      <p class="label" style="margin-bottom:7px">Ground yourself first</p>
      <p class="body-text" style="font-size:.84rem">Name five things you can physically feel right now. The weight of the chair. The temperature of your hands. Your feet on the floor. Take thirty seconds.</p>
    </div>
    <div class="card" style="text-align:left;margin-bottom:14px;background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.065)">
      <p class="label" style="margin-bottom:4px">Put the thoughts down</p>
      <p class="muted" style="font-size:.73rem;margin-bottom:5px">You decide tomorrow whether to keep or release them.</p>
      <textarea class="dump-ta" placeholder="Whatever is circling..."></textarea>
    </div>
    ${ev?`<div style="padding:18px;background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.1);border-radius:var(--radius);margin-bottom:24px;text-align:left"><p class="label" style="margin-bottom:7px;color:rgba(201,168,76,.45)">Something true about you</p><p style="font-family:var(--font-d);font-style:italic;font-size:.98rem;color:rgba(240,235,224,.7);line-height:1.5">${ev}</p></div>`:''}
    ${nightComp?`<div style="max-width:380px;margin:0 auto 20px">${nightComp}</div>`:''}
    <p class="body-text" style="font-size:.8rem;opacity:.35;margin-bottom:28px">This is not the whole story.</p>
    <button class="btn btn-ghost btn-full" onclick="back()" style="opacity:.38;border-color:rgba(255,255,255,.07);color:rgba(255,255,255,.3)">Return to day</button>
  </div></div>`
}

function rDone(){
  const msg=todayData.close?.tomorrow||'';
  return`<div class="screen" style="display:flex"><div class="screen-inner" style="justify-content:center;text-align:center">
    <div class="logo" style="margin-bottom:55px">Woblii</div>
    <div class="display" style="margin-bottom:14px">Day closed.</div>
    ${msg?`<div class="card" style="text-align:left;margin:22px 0"><p class="label" style="margin-bottom:7px">From you, to tomorrow</p><p style="font-family:var(--font-d);font-style:italic;font-size:1rem;line-height:1.5;color:var(--text-soft)">${msg}</p></div>`:''}
    <p class="body-text" style="margin:22px 0">Coming back is the whole skill.<br>You have already done it.</p>
    <button class="btn btn-primary" onclick="go('welcome')">Start fresh tomorrow</button>
  </div></div>`
}

// ================================================================
// MID-DAY CHECK-IN
// ================================================================
function openMidday(){
  const cur=todayData?.state||'steady';
  middayNew=cur;
  document.getElementById('midday-modal').innerHTML=`
  <div class="midday-modal" onclick="if(event.target===this)closeMidday()">
    <div class="midday-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="heading" style="font-size:1.2rem">Mid-day check in</div>
        <button class="btn-icon" onclick="closeMidday()">×</button>
      </div>
      <p class="body-text" style="font-size:.84rem;margin-bottom:12px">How's the jar actually feeling now?</p>
      <div style="display:flex;flex-wrap:wrap">
        ${STATES.map(s=>`<div class="mds-btn ${s.id===cur?'on':''}" onclick="midSel('${s.id}')">${s.emoji} ${s.label}</div>`).join('')}
      </div>
      <p class="muted" style="font-size:.74rem;margin:12px 0 20px">If your state has shifted, your companion and energy jar will update.</p>
      <button class="btn btn-primary btn-full" onclick="saveMidday()">Update and continue →</button>
      <div class="gap-sm"></div>
      <button class="btn btn-ghost btn-full" onclick="closeMidday()">Nothing has changed</button>
    </div>
  </div>`;
}
function midSel(id){
  middayNew=id;
  document.querySelectorAll('.mds-btn').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')?.includes(`'${id}'`)));
}
function saveMidday(){
  if(middayNew&&middayNew!==todayData.state){
    todayData.state=middayNew;
    document.body.dataset.state=middayNew;
    scheduleSave();
    toast('Updated. Your day adapts with you.');
  }
  closeMidday();go('day');
}
function closeMidday(){document.getElementById('midday-modal').innerHTML=''}

// ================================================================
// ACTIONS
// ================================================================
function startDay(){tmp={state:'',body:{},size:'small'};go('state-check')}
function completeReturn(){go('state-check')}
function selState(id){tmp.state=id;go('state-check')}
function selBody(f,v){tmp.body[f]=v;go('body-check')}
function goBody(){if(tmp.state)go('body-check')}
function back(){todayData?.state?go('day'):go('welcome')}

async function goDay(){
  todayData.state=tmp.state;
  todayData.body={...tmp.body};
  document.body.dataset.state=tmp.state;
  scheduleSave();
  go('day');
}

function saveORT(v){
  todayData.oneRealThing=v;
  scheduleSave();
}
function toggleORT(){
  if(!todayData.oneRealThing?.trim()){toast('Add your one real thing first');return}
  todayData.ortDone=!todayData.ortDone;
  scheduleSave();
  if(todayData.ortDone){
    const comp=STATES.find(s=>s.id===todayData.state)?.companion;
    if(comp)updateBubble(rnd(MSG[comp].ortDone));
    toast('✓ The one real thing. Done.');
  }
  setTimeout(()=>go('day'),320);
}
function selSize(id){
  tmp.size=id;
  document.querySelectorAll('.sopt').forEach(el=>el.classList.toggle('on',el.getAttribute('onclick')?.includes(`'${id}'`)));
}
function toggleForm(){
  const f=document.getElementById('add-form'),b=document.getElementById('add-btn');
  if(!f)return;const o=f.classList.toggle('open');b.style.display=o?'none':'';
  if(o)f.querySelector('input')?.focus();
}
function addTask(){
  const text=document.getElementById('ti')?.value?.trim();
  const bc=document.getElementById('bci')?.value?.trim();
  if(!text){toast('What is the task?');return}
  const st=STATES.find(s=>s.id===todayData.state)||STATES[2];
  const used=todayData.tasks.filter(k=>!k.done).reduce((s,k)=>s+(SIZES.find(z=>z.id===k.size)?.drops||2),0);
  const adding=SIZES.find(s=>s.id===tmp.size)?.drops||2;
  if(used+adding>st.jar){
    const comp=STATES.find(s=>s.id===todayData.state)?.companion;
    if(comp)updateBubble(MSG[comp].overJar);
    toast('Jar is at capacity. Size down?',2800);
  }
  todayData.tasks.push({id:Date.now().toString(),text,size:tmp.size,done:false,bc:bc||''});
  scheduleSave();go('day');
}
function toggleTask(id){
  const tk=todayData.tasks.find(t=>t.id===id);if(!tk)return;
  tk.done=!tk.done;
  scheduleSave();
  if(tk.done){
    const comp=STATES.find(s=>s.id===todayData.state)?.companion;
    if(comp){
      updateBubble(rnd(MSG[comp].taskDone));
      const toasts={crunchy:['Crunch! ✓','Belter! ✓','Yes! ✓'],grumble:['Hmph. Done.','Right then.','It worked.'],colin:['Good.','Sorted.','Nice.']};
      toast(rnd(toasts[comp]||['Done.']));
    } else toast('Done.')
  }
  setTimeout(()=>go('day'),340);
}
function delTask(id){
  todayData.tasks=todayData.tasks.filter(t=>t.id!==id);
  scheduleSave();go('day');
}
function addVoltage(){
  const v=document.getElementById('vi')?.value?.trim();if(!v)return;
  todayData.voltageBox.push({id:Date.now().toString(),text:v,timestamp:Date.now()});
  scheduleSave();
  updateBubble(MSG.crunchy.voltage);
  toast('Held. 48 hours before it becomes a commitment.');go('day');
}
async function addEvidence(){
  const text=document.getElementById('ei')?.value?.trim();if(!text)return;
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const item=await dbAddEvidence(text,dateStr);
  if(item){evidenceItems.unshift(item);toast('Added to your wall.');go('evidence');}
  else toast('Could not save. Please try again.');
}
async function deleteEvidence(id){
  await dbDeleteEvidence(id);
  evidenceItems=evidenceItems.filter(e=>e.id!==id);
  go('evidence');
}
function saveClose(){
  todayData.close={
    happening:document.getElementById('cl-h')?.value?.trim(),
    tomorrow:document.getElementById('cl-t')?.value?.trim(),
    closedAt:Date.now()
  };
  scheduleSave();go('done');
}

// ================================================================
// INIT
// ================================================================
document.addEventListener('DOMContentLoaded',()=>{
  go('loading');

  sb.auth.onAuthStateChange(async(event,session)=>{
    if(session?.user){
      currentUser=session.user;
      // Clean up magic link tokens from URL
      if(window.location.hash&&window.location.hash.includes('access_token')){
        window.history.replaceState({},document.title,window.location.pathname+window.location.search);
      }
      await loadUserData();
    } else {
      currentUser=null;todayData=freshToday();evidenceItems=[];
      go('signin');
    }
  });
});
</script>
</body>
</html>
